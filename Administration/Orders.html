}

    border-color: rgba(255,255,255,.40) !important;
}

    content: "";
    position: absolute;

        #FFFFFF,
        #68788E
    );
}

.t-MetricCard-content {
    background: transparent !important;
    text-align: center;

    z-index: 1;
